{% extends "base.html" %}

{% block title %}Webmaster Login - Through the Ages{% endblock %}

{% block content %}
<div style="max-width: 440px; width: 100%; margin: 2.5rem auto; padding: clamp(1.2rem, 5vw, 2rem); background: rgba(26, 17, 12, 0.95); border: 1.5px solid var(--accent-gold); border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.85); backdrop-filter: blur(8px);">
  <div style="text-align: center; margin-bottom: 1.75rem;">
    <h2 style="font-family: var(--font-heading); color: var(--accent-gold); font-size: 1.8rem; letter-spacing: 1px; text-transform: uppercase;">Webmaster Access</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.4rem;">Enter your administrative password to manage scrapers and tournament data.</p>
  </div>

  {% if error %}
  <div style="background: rgba(142, 30, 29, 0.35); border: 1px solid #e57373; color: #ffcdd2; padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1.5rem; font-size: 0.9rem; text-align: center;">
    {{ error }}
  </div>
  {% endif %}

  <form method="POST" action="{{ url_for('admin.login', next=request.args.get('next')) }}">
    <div style="margin-bottom: 1.5rem;">
      <label for="password" style="display: block; font-family: var(--font-subheading); color: #f5eedb; margin-bottom: 0.5rem; font-size: 0.95rem;">Administrative Password</label>
      <input type="password" id="password" name="password" required autofocus
             placeholder="Enter password"
             style="width: 100%; padding: 0.75rem 1rem; background: rgba(18, 12, 8, 0.9); border: 1px solid var(--border-subtle); border-radius: 5px; color: #fff; font-size: 1rem; outline: none; transition: border-color 0.2s;"
             onfocus="this.style.borderColor='var(--accent-gold)'" onblur="this.style.borderColor='var(--border-subtle)'">
    </div>

    <button type="submit" class="btn-antique" style="width: 100%; justify-content: center; padding: 0.8rem; font-size: 1.05rem;">
      Sign In to Dashboard
    </button>
  </form>

  <div style="text-align: center; margin-top: 1.5rem;">
    <a href="{{ url_for('leaderboard.index') }}" style="color: var(--text-muted); font-size: 0.85rem;">&larr; Return to Public Leaderboard</a>
  </div>
</div>
{% endblock %}
